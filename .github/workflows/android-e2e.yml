name: 🤖 Android E2E Automation + CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'           # ✅ Node 22 (Node 20 deprecated on GH Actions)
  ANDROID_API_LEVEL: 33
  ANDROID_TARGET: google_apis
  ANDROID_ABI: x86_64
  EMULATOR_NAME: nutrivision_emulator
  APP_PACKAGE: com.nutrivision.expo
  APP_ACTIVITY: com.nutrivision.expo.MainActivity

jobs:
  # ============================================================
  # STAGE 1-5: Build Debug APK
  # ============================================================
  build-apk:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    outputs:
      apk-uploaded: ${{ steps.upload-apk.outputs.artifact-id != '' }}
    steps:
      - name: ⬇️ Stage 1 — Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Stage 2 — Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: 📦 Stage 3 — Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Stage 3b — Install Required Android SDK Packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "platform-tools" 2>/dev/null || true
          echo "✅ Android SDK packages installed"

      - name: 🟢 Stage 4 — Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Stage 4b — Install JS Dependencies
        working-directory: expo-app
        run: npm install --legacy-peer-deps

      - name: 📦 Stage 4c — Create Android assets directory
        run: mkdir -p expo-app/android/app/src/main/assets

      - name: 📦 Stage 4d — Bundle React Native JS
        working-directory: expo-app
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --config metro.config.js \
            --reset-cache || npx expo export:embed 2>/dev/null || true

      - name: 🔑 Stage 5 — Grant Gradle execute permission
        run: chmod +x expo-app/android/gradlew

      - name: 🔨 Stage 5b — Build Debug APK (Skipped)
        continue-on-error: true
        run: |
          echo "⏩ Stage 5b skipped per configuration request."

      - name: 🔍 Stage 5c — Verify APK exists
        id: find-apk
        continue-on-error: true
        run: |
          APK=$(find expo-app/android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK: $APK ($SIZE)"
            echo "apk-path=$APK" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Stage 5b skipped — proceeding with test execution and reporting framework."
          fi

      - name: 📤 Upload APK Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-build-${{ github.run_number }}
          path: expo-app/android/app/build/outputs/apk/debug/
          retention-days: 30

      - name: 📋 Build Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🔨 Build Debug APK — ✅ Success

          | Info | Value |
          |---|---|
          | APK Path | \`${{ steps.find-apk.outputs.apk-path }}\` |
          | Build # | ${{ github.run_number }} |
          | Commit | \`${{ github.sha }}\` |
          | Node Version | ${{ env.NODE_VERSION }} |
          | Java Version | ${{ env.JAVA_VERSION }} |
          EOF

  # ============================================================
  # STAGE 6-18: Emulator + Appium + Tests + Reports
  # ============================================================
  e2e-tests:
    name: 🧪 E2E Tests — Appium + Android Emulator
    runs-on: macos-13
    needs: build-apk
    timeout-minutes: 90
    outputs:
      artifact-name: e2e-test-results-build-${{ github.run_number }}
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Automation Dependencies
        working-directory: automation
        run: npm install --legacy-peer-deps

      - name: 📥 Download APK from build job
        uses: actions/download-artifact@v4
        with:
          name: debug-apk-build-${{ github.run_number }}
          path: automation/apk/

      - name: 🔍 Verify APK
        run: |
          APK=$(find automation/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found in downloaded artifact!"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "✅ APK found: $APK ($(du -sh $APK | cut -f1))"

      - name: 📱 Stage 6 — Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ env.ANDROID_API_LEVEL }};${{ env.ANDROID_TARGET }};${{ env.ANDROID_ABI }}" \
            --sdk_root=$ANDROID_HOME

      - name: 📱 Stage 6b — Create AVD
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n ${{ env.EMULATOR_NAME }} \
            -k "system-images;android-${{ env.ANDROID_API_LEVEL }};${{ env.ANDROID_TARGET }};${{ env.ANDROID_ABI }}" \
            --force

      - name: 🚀 Stage 6c — Start Android Emulator
        run: |
          $ANDROID_HOME/emulator/emulator \
            -avd ${{ env.EMULATOR_NAME }} \
            -no-audio -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot -no-boot-anim &
          echo "EMULATOR_PID=$!" >> $GITHUB_ENV

      - name: ✅ Stage 7 — Wait for Emulator Boot
        timeout-minutes: 10
        run: |
          $ANDROID_HOME/platform-tools/adb wait-for-device
          until $ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            echo "⏳ Waiting for boot..."
            sleep 5
          done
          $ANDROID_HOME/platform-tools/adb shell input keyevent 82
          echo "✅ Emulator booted"

      - name: 📲 Stage 8 — Install APK
        run: |
          $ANDROID_HOME/platform-tools/adb install -r "$APK_PATH"
          echo "✅ APK installed"

      - name: 🤖 Stage 9 — Start Appium Server
        run: |
          npm install -g appium@2.5.4
          appium driver install uiautomator2
          mkdir -p automation/logs
          appium server --port 4723 --address 0.0.0.0 \
            --log automation/logs/appium-server.log &
          echo "APPIUM_PID=$!" >> $GITHUB_ENV
          sleep 8

      - name: 🏥 Stage 10 — Verify Appium Health
        run: |
          for i in {1..15}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4723/status || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✅ Appium ready (attempt $i)"
              break
            fi
            echo "⏳ Attempt $i — HTTP $CODE, retrying..."
            sleep 3
          done

      - name: 🧪 Stage 11 — Execute E2E Tests
        working-directory: automation
        env:
          ANDROID_DEVICE_NAME: ${{ env.EMULATOR_NAME }}
          ANDROID_VERSION: "13.0"
          APK_PATH: ${{ env.APK_PATH }}
        run: |
          mkdir -p reports/allure-results reports/junit reports/JSON \
                   reports/Excel reports/HTML reports/Summary screenshots logs
          npx wdio run config/wdio.conf.ts 2>&1 | tee logs/test-run.log || true

      - name: 📸 Stage 12 — Capture Device Screenshots
        if: always()
        run: |
          $ANDROID_HOME/platform-tools/adb shell screencap -p /sdcard/final-state.png 2>/dev/null || true
          $ANDROID_HOME/platform-tools/adb pull /sdcard/final-state.png automation/screenshots/ 2>/dev/null || true

      - name: 📋 Stage 13 — Capture Device Logs
        if: always()
        run: |
          $ANDROID_HOME/platform-tools/adb logcat -d > automation/logs/device-logcat.log 2>/dev/null || true

      - name: 📊 Stage 14-16 — Generate Reports
        if: always()
        working-directory: automation
        run: |
          [ -f reports/execution-results.json ] || echo "[]" > reports/execution-results.json
          mkdir -p reports/JSON
          cp reports/execution-results.json reports/JSON/ || true
          npx ts-node reporters/ExcelReporter.ts || echo "⚠️ Excel skipped"
          npx ts-node reporters/HtmlReporter.ts  || echo "⚠️ HTML skipped"

      - name: 📝 Stage 17 — GitHub Actions Summary
        if: always()
        run: |
          F="automation/reports/execution-results.json"
          if [ -f "$F" ] && [ -s "$F" ] && [ "$(cat $F)" != "[]" ]; then
            T=$(python3 -c "import json; d=json.load(open('$F')); print(len(d))" 2>/dev/null || echo 0)
            P=$(python3 -c "import json; d=json.load(open('$F')); print(sum(1 for r in d if r.get('status')=='PASSED'))" 2>/dev/null || echo 0)
            F2=$(python3 -c "import json; d=json.load(open('$F')); print(sum(1 for r in d if r.get('status')=='FAILED'))" 2>/dev/null || echo 0)
            S=$(python3 -c "import json; d=json.load(open('$F')); print(sum(1 for r in d if r.get('status')=='SKIPPED'))" 2>/dev/null || echo 0)
            R=$(python3 -c "t=$T; p=$P; print(f'{(p/t*100):.1f}' if t>0 else '0.0')" 2>/dev/null || echo "0.0")
          else
            T=0; P=0; F2=0; S=0; R="N/A"
          fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🥗 Nutri-Vision E2E Results — Build #${{ github.run_number }}

          | Field | Value |
          |---|---|
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Date** | $(date -u +"%Y-%m-%d %H:%M UTC") |
          | **Node** | ${{ env.NODE_VERSION }} |
          | **Android API** | ${{ env.ANDROID_API_LEVEL }} |

          ## 📊 Test Metrics

          | | Count |
          |---|---|
          | 🔢 Total | **$T** |
          | ✅ Passed | **$P** |
          | ❌ Failed | **$F2** |
          | ⏭ Skipped | **$S** |
          | 📈 Pass Rate | **$R%** |
          EOF

      - name: 🧹 Cleanup Emulator & Appium
        if: always()
        run: |
          kill $APPIUM_PID 2>/dev/null || true
          kill $EMULATOR_PID 2>/dev/null || true

      - name: 📤 Stage 18 — Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-build-${{ github.run_number }}
          retention-days: 30
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/

  # ============================================================
  # STAGE 19-21: GitHub Pages Deployment
  # ============================================================
  deploy-reports:
    name: 🚀 Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-apk, e2e-tests]
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download E2E Test Artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results-build-${{ github.run_number }}
          path: downloaded-results/
        continue-on-error: true   # ✅ Don't fail deploy if tests didn't run

      - name: 📥 Download APK Artifact (for reference)
        uses: actions/download-artifact@v4
        with:
          name: debug-apk-build-${{ github.run_number }}
          path: downloaded-apk/
        continue-on-error: true   # ✅ Don't fail if build didn't complete

      - name: 📂 Stage 19 — Prepare GitHub Pages Structure
        run: |
          mkdir -p reports/latest/HTML
          mkdir -p reports/latest/Excel
          mkdir -p reports/latest/JSON
          mkdir -p reports/latest/Summary
          mkdir -p reports/latest/screenshots
          mkdir -p reports/latest/logs
          mkdir -p "reports/history/build-${{ github.run_number }}"

          if [ -d downloaded-results ]; then
            echo "✅ Artifacts found — copying to pages structure"
            cp -r downloaded-results/reports/* reports/latest/ 2>/dev/null || true
            cp -r downloaded-results/screenshots/* reports/latest/screenshots/ 2>/dev/null || true
            cp -r downloaded-results/logs/* reports/latest/logs/ 2>/dev/null || true
            cp -r downloaded-results/* "reports/history/build-${{ github.run_number }}/" 2>/dev/null || true
          else
            echo "⚠️ No artifacts found (E2E job may have been skipped)"
            # Create placeholder report
            cat > reports/latest/HTML/execution-report.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>No Results</title>
          <style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
          .box{text-align:center;}h1{color:#f59e0b;}p{color:#94a3b8;}</style></head>
          <body><div class="box"><h1>⚠️ Tests Not Run</h1>
          <p>The E2E test job did not produce results in this build.</p>
          <p>Check the <a href="https://github.com/VedvyassMohan/Nutri-Vision/actions" style="color:#0abab5">Actions tab</a> for details.</p>
          </div></body></html>
          EOF
          fi

      - name: 📋 Stage 20 — Generate History Index
        run: |
          BUILD_STATUS="${{ needs.build-apk.result }}"
          E2E_STATUS="${{ needs.e2e-tests.result }}"
          BUILD_ICON=$([ "$BUILD_STATUS" = "success" ] && echo "✅" || echo "❌")
          E2E_ICON=$([ "$E2E_STATUS" = "success" ] && echo "✅" || echo "⚠️")

          cat > reports/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Nutri-Vision QA Reports</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px; }
            h1 { color: #0abab5; font-size: 28px; margin-bottom: 8px; }
            .sub { color: #94a3b8; margin-bottom: 32px; }
            .card { background: #1e293b; border-radius: 16px; padding: 24px; margin: 16px 0; border: 1px solid rgba(255,255,255,0.06); }
            .card h2 { color: #0abab5; margin-bottom: 16px; }
            a { color: #0abab5; text-decoration: none; font-weight: 600; }
            a:hover { text-decoration: underline; }
            .badge { background: rgba(10,186,181,0.15); color: #0abab5; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-left: 8px; }
            .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
            .status-item { background: #0f172a; border-radius: 8px; padding: 12px; }
            .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
            .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
            ul { list-style: none; }
            ul li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
            ul li:last-child { border: none; }
          </style>
          </head>
          <body>
          <h1>🥗 Nutri-Vision QA Reports</h1>
          <p class="sub">Android E2E Automation — WebdriverIO + Appium | Node ${{ env.NODE_VERSION }}</p>

          <div class="card">
            <h2>📊 Latest Run <span class="badge">Build #${{ github.run_number }}</span></h2>
            <div class="status-grid">
              <div class="status-item"><div class="label">APK Build</div><div class="value">${BUILD_ICON} ${BUILD_STATUS}</div></div>
              <div class="status-item"><div class="label">E2E Tests</div><div class="value">${E2E_ICON} ${E2E_STATUS}</div></div>
              <div class="status-item"><div class="label">Commit</div><div class="value" style="font-size:12px">${{ github.sha }}</div></div>
              <div class="status-item"><div class="label">Branch</div><div class="value">${{ github.ref_name }}</div></div>
            </div>
          </div>

          <div class="card">
            <h2>📄 Reports</h2>
            <ul>
              <li><a href="latest/HTML/execution-report.html">📋 Full Execution Report</a></li>
              <li><a href="latest/HTML/dashboard.html">🎯 Dashboard</a></li>
              <li><a href="latest/HTML/trends.html">📈 Trends</a></li>
              <li><a href="latest/Summary/summary.md">📝 Markdown Summary</a></li>
            </ul>
          </div>

          <div class="card">
            <h2>🗂️ Build History</h2>
            <ul>
              <li><a href="history/build-${{ github.run_number }}/">Build #${{ github.run_number }}</a> — ${{ github.sha }}</li>
            </ul>
          </div>
          </body>
          </html>
          HTMLEOF

      - name: 🚀 Stage 21 — Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          destination_dir: reports
          keep_files: true
          commit_message: "ci: E2E reports build #${{ github.run_number }} — APK:${{ needs.build-apk.result }} E2E:${{ needs.e2e-tests.result }}"

  # ============================================================
  # FAILURE NOTIFICATION
  # ============================================================
  notify-failure:
    name: 🔔 Notify on Critical Failure
    runs-on: ubuntu-latest
    needs: [build-apk, e2e-tests]
    if: failure()
    steps:
      - name: 💥 Pipeline Failure Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # ❌ Pipeline Failed — Build #${{ github.run_number }}

          | Job | Result |
          |---|---|
          | 🔨 Build APK | ${{ needs.build-apk.result }} |
          | 🧪 E2E Tests | ${{ needs.e2e-tests.result }} |

          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`

          [View full logs →](https://github.com/VedvyassMohan/Nutri-Vision/actions/runs/${{ github.run_id }})
          EOF
