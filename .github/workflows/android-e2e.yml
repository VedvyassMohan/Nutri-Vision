name: 🤖 Android E2E Automation + CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM UTC

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  ANDROID_API_LEVEL: 33
  ANDROID_TARGET: google_apis
  ANDROID_ABI: x86_64
  EMULATOR_NAME: nutrivision_emulator
  APP_PACKAGE: com.nutrivision.expo
  APP_ACTIVITY: com.nutrivision.expo.MainActivity
  APPIUM_VERSION: '2.0.0'

jobs:
  # ========================================================
  # STAGE 1-5: Checkout + Setup + Build APK
  # ========================================================
  build-apk:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.find-apk.outputs.apk-path }}
    steps:
      - name: ⬇️ Stage 1 — Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Stage 2 — Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: 📦 Stage 3 — Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Stage 4 — Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: 📦 Stage 4b — Install JS Dependencies
        working-directory: expo-app
        run: npm ci

      - name: 📦 Stage 4c — Bundle JS Assets
        working-directory: expo-app
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 🔨 Stage 5 — Build Debug APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug \
            -x lint -x test \
            --build-cache \
            --parallel \
            --no-daemon

      - name: 🔍 Stage 5b — Find APK
        id: find-apk
        run: |
          APK=$(find expo-app/android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk-path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: expo-app/android/app/build/outputs/apk/debug/
          retention-days: 30

  # ========================================================
  # STAGE 6-21: Emulator + Appium + Tests + Reports
  # ========================================================
  e2e-tests:
    name: 🧪 E2E Tests — Appium + Android Emulator
    runs-on: macos-latest   # macOS for hardware acceleration (HAXM)
    needs: build-apk
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Automation Dependencies
        working-directory: automation
        run: npm ci

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: automation/apk/

      - name: 🔍 Verify APK
        run: |
          APK=$(find automation/apk -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK found: $APK"
          ls -la $APK

      - name: 📱 Stage 6 — Create Android Emulator
        run: |
          echo "yes" | sdkmanager "system-images;android-${{ env.ANDROID_API_LEVEL }};${{ env.ANDROID_TARGET }};${{ env.ANDROID_ABI }}" --no_https
          echo "no" | avdmanager create avd \
            -n ${{ env.EMULATOR_NAME }} \
            -k "system-images;android-${{ env.ANDROID_API_LEVEL }};${{ env.ANDROID_TARGET }};${{ env.ANDROID_ABI }}" \
            --force

      - name: 🚀 Stage 6b — Start Android Emulator
        run: |
          $ANDROID_HOME/emulator/emulator -avd ${{ env.EMULATOR_NAME }} \
            -no-audio -no-window -gpu swiftshader_indirect -no-snapshot &
          echo $! > emulator.pid

      - name: ✅ Stage 7 — Verify Emulator Readiness
        timeout-minutes: 10
        run: |
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
            echo "⏳ Waiting for emulator to fully boot..."
            sleep 5
          done
          adb shell input keyevent 82
          echo "✅ Emulator ready"
          adb devices

      - name: 📲 Stage 8 — Install APK on Emulator
        run: |
          adb install -r "$APK_PATH"
          echo "✅ APK installed"

      - name: 🤖 Stage 9 — Start Appium Server
        run: |
          npm install -g appium@${{ env.APPIUM_VERSION }}
          appium driver install uiautomator2
          appium server --port 4723 --address 0.0.0.0 \
            --log automation/logs/appium.log &
          echo $! > appium.pid
          sleep 5

      - name: 🏥 Stage 10 — Verify Appium Health
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4723/status)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Appium server ready"
              break
            fi
            echo "Attempt $i — Appium not ready yet, waiting..."
            sleep 3
          done
          curl -s http://localhost:4723/status | python3 -m json.tool

      - name: 🧪 Stage 11 — Execute Appium E2E Tests
        working-directory: automation
        env:
          ANDROID_DEVICE_NAME: ${{ env.EMULATOR_NAME }}
          ANDROID_VERSION: "13.0"
          APK_PATH: ${{ env.APK_PATH }}
        run: |
          mkdir -p reports screenshots logs
          npx wdio run config/wdio.conf.ts 2>&1 | tee logs/test-run.log || true

      - name: 📸 Stage 12 — Capture Additional Device Screenshots
        if: always()
        run: |
          adb shell screencap -p /sdcard/final-state.png
          adb pull /sdcard/final-state.png automation/screenshots/ || true

      - name: 📋 Stage 13 — Capture Device Logs
        if: always()
        run: |
          adb logcat -d > automation/logs/device-logcat.log || true

      - name: 📊 Stage 14 — Generate Excel Reports
        if: always()
        working-directory: automation
        run: npx ts-node reporters/ExcelReporter.ts || true

      - name: 🌐 Stage 15 — Generate HTML Reports
        if: always()
        working-directory: automation
        run: npx ts-node reporters/HtmlReporter.ts || true

      - name: 📝 Stage 16 — Copy JSON Report
        if: always()
        run: |
          cp automation/reports/execution-results.json automation/reports/JSON/ || true

      - name: 📋 Stage 17 — Generate GitHub Actions Summary
        if: always()
        run: |
          RESULTS_FILE="automation/reports/execution-results.json"
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(len(d))")
            PASSED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(sum(1 for r in d if r['status']=='PASSED'))")
            FAILED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(sum(1 for r in d if r['status']=='FAILED'))")
            SKIPPED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(sum(1 for r in d if r['status']=='SKIPPED'))")
            RATE=$(python3 -c "t=$TOTAL; p=$PASSED; print(f'{(p/t*100):.1f}' if t>0 else '0')")
          else
            TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0; RATE=0
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🥗 Nutri-Vision Android E2E Execution Summary

          | Field | Value |
          |---|---|
          | **Build** | #${{ github.run_number }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Commit** | ${{ github.sha }} |
          | **Date** | $(date -u +"%Y-%m-%d %H:%M UTC") |
          | **App Package** | \`com.nutrivision.expo\` |
          | **Android API** | ${{ env.ANDROID_API_LEVEL }} |
          | **Emulator** | ${{ env.EMULATOR_NAME }} |

          ## 📊 Execution Metrics

          | Status | Count |
          |---|---|
          | 🔢 **Total Tests** | **$TOTAL** |
          | ✅ **Passed** | **$PASSED** |
          | ❌ **Failed** | **$FAILED** |
          | ⏭ **Skipped** | **$SKIPPED** |
          | 📈 **Pass Rate** | **$RATE%** |

          ## 📄 Reports

          - [📊 Excel Report](https://VedvyassMohan.github.io/Nutri-Vision/reports/latest/Excel/Automation_Test_Report.xlsx)
          - [🌐 HTML Report](https://VedvyassMohan.github.io/Nutri-Vision/reports/latest/HTML/execution-report.html)
          - [📋 Dashboard](https://VedvyassMohan.github.io/Nutri-Vision/reports/latest/HTML/dashboard.html)
          EOF

      - name: 📤 Stage 18 — Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-build-${{ github.run_number }}
          retention-days: 30
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/

      - name: 🧹 Cleanup Emulator
        if: always()
        run: |
          kill $(cat emulator.pid) || true
          kill $(cat appium.pid) || true

  # ========================================================
  # STAGE 19-21: GitHub Pages Deployment
  # ========================================================
  deploy-reports:
    name: 🚀 Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - name: ⬇️ Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: ⬇️ Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results-build-${{ github.run_number }}
          path: downloaded-results/

      - name: 📂 Stage 19 — Prepare Pages Structure
        run: |
          mkdir -p reports/latest
          mkdir -p reports/history/build-${{ github.run_number }}

          # Copy to latest/
          cp -r downloaded-results/* reports/latest/ || true

          # Archive to history
          cp -r downloaded-results/* reports/history/build-${{ github.run_number }}/ || true

      - name: 📋 Stage 20 — Generate History Index
        run: |
          cat > reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Nutri-Vision QA Reports</title>
          <style>
            body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 40px; }
            h1 { color: #0abab5; } a { color: #0abab5; }
            .card { background: #1e293b; border-radius: 12px; padding: 20px; margin: 12px 0; }
          </style></head>
          <body>
          <h1>🥗 Nutri-Vision QA Reports</h1>
          <div class="card">
            <h2>Latest Report — Build #${{ github.run_number }}</h2>
            <p><a href="latest/HTML/execution-report.html">📊 Full Execution Report</a></p>
            <p><a href="latest/HTML/dashboard.html">📋 Dashboard</a></p>
            <p><a href="latest/Summary/summary.md">📝 Summary</a></p>
          </div>
          <div class="card">
            <h2>Build History</h2>
            <p><a href="history/build-${{ github.run_number }}/">Build #${{ github.run_number }}</a> — $(date -u)</p>
          </div>
          </body></html>
          EOF

      - name: 🚀 Stage 21 — Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports
          destination_dir: reports
          keep_files: true
          commit_message: "ci: publish E2E test reports for build #${{ github.run_number }}"

  # ========================================================
  # FAILURE NOTIFICATION
  # ========================================================
  notify-failure:
    name: 🔔 Notify on Critical Failure
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: failure()
    steps:
      - name: 💥 Failure Summary
        run: |
          echo "::error::E2E Test suite failed! Check artifacts for screenshots and logs."
          echo "Pipeline failed at job: ${{ github.job }}"
